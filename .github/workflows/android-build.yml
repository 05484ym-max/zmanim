name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # GitHub's Ubuntu runner already includes the Android SDK. The old
      # android-actions/setup-android@v3 action now tries to install the removed
      # legacy package named "tools", which makes the job fail before Gradle
      # even starts. Use the runner's sdkmanager directly and install only what
      # this project actually needs.
      - name: Prepare Android SDK 34
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # No gradlew binary is committed (see README) - invoking `gradle` directly
      # uses the version setup-gradle just installed.
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK (per-run artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zmanim-lockscreen-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      # Stable download link that never changes between builds: overwrites the
      # same "nightly" release/tag every push to main, instead of a fresh
      # per-run artifact URL each time.
      - name: Publish stable "nightly" release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Nightly build"
          prerelease: true
          body: "Always the latest main branch build. Commit ${{ github.sha }}."
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
